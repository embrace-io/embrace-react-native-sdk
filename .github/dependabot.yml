version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github:
        patterns:
          - "actions/*"
      codeql:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 50
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "inquirer"
        update-types: ["version-update:semver-major"]
    groups:
      react-native:
        patterns:
          - 'react-native'
          - '@react-native/*'
      jest:
        patterns:
          - '*jest*'
        exclude-patterns:
          - '@react-native/*'
      eslint:
        patterns:
          - '*eslint*'
      babel:
        patterns:
          - '@babel*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-test-renderer'
      webdriverio:
        patterns:
          - 'webdriverio'
          - '@wdio/*'
